<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<title>TokenGauge — ตัวอย่างหน้าตา</title>
<!--
  ไฟล์นี้ถูกสร้างอัตโนมัติจาก renderer/ ด้วย `npm run build:demo`
  ห้ามแก้ตรงนี้ — แก้ renderer/index.html, styles.css, app.js หรือ scripts/demo-mock.js แทน
-->
<style>
/* TokenGauge — instrument cluster theme
   display : Bahnschrift (มากับ Windows 10+) สำหรับตัวเลขหน้าปัด
   body    : Segoe UI Variable / Leelawadee UI สำหรับภาษาไทย
   utility : Cascadia Mono สำหรับตัวนับเวลา                        */

:root {
  --bg: #0b0e13;
  --bg-2: #10151d;
  --panel: #151b25;
  --panel-2: #1b2331;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #e8eef7;
  --muted: #7c8aa1;
  --dim: #56637a;
  --track: #232c3a;
  --warn: #f5c451;
  --danger: #ff6b6b;
  --radius: 16px;
  --font-display: 'Bahnschrift', 'Segoe UI Variable Display', 'Segoe UI Semibold', system-ui, sans-serif;
  --font-body: 'Segoe UI Variable Text', 'Segoe UI', 'Leelawadee UI', 'Noto Sans Thai', system-ui, sans-serif;
  --font-mono: 'Cascadia Mono', 'Consolas', ui-monospace, monospace;
}

/* ธีมสว่าง — ทับเฉพาะตัวแปร โครงสร้างอื่นใช้ร่วมกัน */
body.light {
  --bg: #eef1f6;
  --bg-2: #e4e9f1;
  --panel: #ffffff;
  --panel-2: #edf0f6;
  --line: rgba(20, 30, 50, 0.08);
  --line-strong: rgba(20, 30, 50, 0.18);
  --text: #1d2534;
  --muted: #56657d;
  --dim: #8592a6;
  --track: #dfe5ee;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}

body::before {
  /* แสงจาง ๆ ด้านบน ให้ความรู้สึกเป็นแผงหน้าปัดที่มีไฟส่อง */
  content: '';
  position: fixed;
  inset: -30% 0 auto 0;
  height: 60%;
  background: radial-gradient(60% 100% at 50% 0%, rgba(90, 130, 200, 0.13), transparent 70%);
  pointer-events: none;
}

/* ---------- title bar ---------- */
.titlebar {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 6px 0 16px;
  -webkit-app-region: drag;
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 9px; }
.brand b {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.06em;
}
.brand span { color: var(--dim); font-size: 11.5px; letter-spacing: 0.04em; }

.live {
  display: flex; align-items: center; gap: 7px;
  margin-left: auto; margin-right: 10px;
  color: var(--muted); font-size: 11.5px;
  font-family: var(--font-mono);
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #3ddc84; box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.5);
  animation: pulse 2.4s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.45); }
  70% { box-shadow: 0 0 0 7px rgba(61, 220, 132, 0); }
  100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); }
}

.win-btns { display: flex; -webkit-app-region: no-drag; }
.win-btns button {
  width: 42px; height: 44px;
  background: none; border: 0; color: var(--muted);
  font-size: 13px; cursor: pointer; transition: background 0.15s, color 0.15s;
}
.win-btns button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.win-btns button.close:hover { background: #c8352f; color: #fff; }

/* ---------- layout ---------- */
main {
  height: calc(100% - 44px - 56px);
  overflow-y: auto;
  padding: 22px 22px 8px;
}
.head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
.head h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 27px;
  letter-spacing: -0.01em;
}
.head .sub { color: var(--dim); font-size: 12px; font-family: var(--font-mono); padding-bottom: 4px; }

.grid {
  display: grid;
  /* 3 การ์ดเรียงแถวเดียวเสมอ ไม่ตกบรรทัด */
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

[hidden] { display: none !important; }

/* ---------- แท็บ ภาพรวม/ประวัติ ---------- */
.tabs {
  margin-left: auto;
  display: flex; gap: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px; padding: 3px;
}
.tab {
  border: 0; background: transparent;
  color: var(--muted); font-family: var(--font-body); font-size: 12.5px;
  padding: 6px 14px; border-radius: 8px; cursor: pointer;
}
.tab.active { background: var(--panel-2); color: var(--text); }

/* ---------- หน้าประวัติ ---------- */
.h-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.seg {
  display: flex; gap: 4px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 3px;
}
.seg-b {
  border: 0; background: transparent;
  color: var(--muted); font-family: var(--font-body); font-size: 12px;
  padding: 5px 12px; border-radius: 8px; cursor: pointer;
}
.seg-b.active { background: var(--panel-2); color: var(--text); }
.legend { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
.legend b { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 6px; }
.chart-wrap {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 10px 8px;
}
#h-chart { width: 100%; height: auto; display: block; }
.h-grid { stroke: var(--line); }
.h-y { fill: var(--dim); font-size: 10px; text-anchor: end; font-family: var(--font-mono); }
.h-x { fill: var(--dim); font-size: 10px; text-anchor: middle; font-family: var(--font-body); }
.h-note { color: var(--dim); font-size: 11.5px; margin: 10px 2px 0; }
body.mini .tabs, body.mini #history { display: none !important; }

/* ---------- provider card ---------- */
.card {
  /* ย้อมโทนสีของผู้ให้บริการลงพื้นการ์ด ให้สามใบต่างกันชัด */
  background:
    radial-gradient(130% 80% at 50% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 58%),
    linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
  border-radius: var(--radius);
  padding: 18px;
  position: relative;
  overflow: hidden;
  animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  box-shadow: 0 10px 26px -16px color-mix(in srgb, var(--accent) 45%, transparent);
}
.card::after {
  /* เส้นแสงบางบนขอบบน สีตามผู้ให้บริการ */
  content: '';
  position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.55;
}
.card:nth-child(2) { animation-delay: 0.06s; }
.card:nth-child(3) { animation-delay: 0.12s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 6px; }
.mark {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 600; font-size: 16px;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
.card-head .n { font-weight: 600; font-size: 15px; }
.card-head .s { color: var(--dim); font-size: 11.5px; }

/* ---------- มาสคอตประจำ AI ---------- */
.mascot { width: 46px; height: 46px; flex: none; }
.mascot svg { width: 100%; height: 100%; overflow: visible; animation: bob 3.8s ease-in-out infinite; }
.card:nth-child(2) .mascot svg { animation-delay: 0.7s; }
.card:nth-child(3) .mascot svg { animation-delay: 1.4s; }
.mascot.sad svg { animation: shiver 0.45s ease-in-out infinite; }
.mascot .body { fill: color-mix(in srgb, var(--accent) 82%, #fff); }
.mascot .eye {
  fill: #101520;
  animation: blink 4.6s infinite;
  transform-box: fill-box; transform-origin: center;
}
.card:nth-child(2) .mascot .eye { animation-delay: 1.5s; }
.card:nth-child(3) .mascot .eye { animation-delay: 3s; }
.mascot .eyelid, .mascot .mouth { stroke: #101520; stroke-width: 1.4; stroke-linecap: round; fill: none; }
.mascot .cheek { fill: #fff; opacity: 0.3; }
.mascot .sweat { fill: #7cc4ff; }
.mascot .leaf { fill: color-mix(in srgb, var(--accent) 55%, #fff); }
.mascot .leaf.l2 { fill: color-mix(in srgb, var(--accent) 80%, #063b26); }
.mascot .saucer {
  fill: color-mix(in srgb, var(--accent) 38%, var(--panel));
  stroke: color-mix(in srgb, var(--accent) 60%, transparent); stroke-width: 1;
}
.mascot .ant { stroke: color-mix(in srgb, var(--accent) 70%, #fff); stroke-width: 1.2; stroke-linecap: round; }
.mascot .ant-tip { fill: #ffd66b; animation: glowtip 2.2s ease-in-out infinite; }
.mascot .lamp { fill: #fff; opacity: 0.85; animation: twinkle 1.6s infinite; }
.mascot .lamp.l2 { animation-delay: 0.5s; }
.mascot .lamp.l3 { animation-delay: 1s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
@keyframes shiver { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94%, 96% { transform: scaleY(0.12); } }
@keyframes twinkle { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.25; } }
@keyframes glowtip { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.pill {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: 0.04em;
  padding: 4px 9px; border-radius: 999px;
  color: color-mix(in srgb, var(--accent) 55%, var(--muted));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line-strong));
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  cursor: pointer;
}
.pill:hover { color: var(--text); border-color: var(--accent); }

/* ป้ายสถานะข้อมูลสด (ฟีเจอร์ opt-in ดึง % ทางการ) */
.live-dot {
  margin-left: auto;
  font-size: 10px; letter-spacing: 0.05em;
  padding: 3px 8px; border-radius: 999px;
  color: #4ade80; background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.35);
  white-space: nowrap;
}
.live-dot.err { color: var(--warn); background: rgba(245, 196, 81, 0.08); border-color: rgba(245, 196, 81, 0.3); }
.live-dot.man { color: #c4b5fd; background: rgba(167, 139, 250, 0.1); border-color: rgba(167, 139, 250, 0.35); }
.live-dot ~ .pill { margin-left: 8px; }
body.mini .live-dot { display: none; }

/* หน้าปัด — signature element */
.gauge { display: grid; place-items: center; padding: 6px 0 2px; position: relative; }
.gauge svg { width: 186px; height: 118px; overflow: visible; }
.gauge .arc-bg { stroke: var(--track); }
.gauge .arc-fg {
  stroke: var(--accent);
  transition: stroke-dashoffset 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), stroke 0.4s;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent));
}
.gauge .tick { stroke: var(--line-strong); }
.gauge-val {
  position: absolute; top: 46px; text-align: center; pointer-events: none;
}
.gauge-val b {
  display: block;
  font-family: var(--font-display);
  font-weight: 600; font-size: 40px; line-height: 1;
  font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, var(--accent) 60%, #fff);
}
.gauge-val b i { font-size: 18px; font-style: normal; color: var(--muted); margin-left: 2px; }
.gauge-val span { display: block; color: var(--dim); font-size: 10.5px; letter-spacing: 0.1em; margin-top: 5px; }

/* วงแหวน % กลม — แสดงเฉพาะโหมดมินิ */
.minigauge { display: none; position: relative; place-items: center; }
.minigauge svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.minigauge .ring-bg { fill: none; stroke: var(--track); stroke-width: 6; }
.minigauge .ring-fg {
  fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), stroke 0.4s;
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 45%, transparent));
}
.minigauge b {
  position: absolute;
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  color: color-mix(in srgb, var(--accent) 60%, #fff);
  font-variant-numeric: tabular-nums;
}
.minigauge b i { font-style: normal; font-size: 9px; color: var(--muted); margin-left: 1px; }

.rows { margin-top: 10px; display: grid; gap: 11px; }
.row .l { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.row .l span { color: var(--muted); font-size: 12px; }
.row .l em {
  margin-left: auto; font-style: normal;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i {
  display: block; height: 100%; border-radius: 3px;
  background: var(--accent);
  transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s;
}
.bar.warn i { background: var(--warn); }
.bar.danger i { background: var(--danger); }
.row.cost .l { margin-bottom: 0; }
.row.cost .l span { font-size: 11px; color: var(--dim); }
.row.cost .l em { color: var(--muted); }
body.mini .row.cost { display: none; }

/* กราฟ 24 ชม. */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 14px; }
.spark i {
  flex: 1; border-radius: 1.5px;
  background: color-mix(in srgb, var(--accent) 42%, transparent);
  min-height: 2px;
  transition: height 0.5s;
}
.spark i.now { background: var(--accent); }

.foot {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--muted);
}
.foot .k { color: var(--dim); letter-spacing: 0.06em; }
.foot .t { margin-left: auto; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }

.empty { padding: 26px 10px 30px; text-align: center; color: var(--muted); }
.empty .big { font-size: 30px; opacity: 0.35; margin-bottom: 10px; }
.empty p { margin: 0 0 14px; font-size: 12.5px; line-height: 1.6; }

/* ---------- bottom bar ---------- */
.bottom {
  height: 56px;
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(8px);
}
.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
.toggle input { display: none; }
.sw {
  width: 34px; height: 19px; border-radius: 999px;
  background: var(--track); position: relative; transition: background 0.2s;
  border: 1px solid var(--line-strong);
}
.sw::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--muted); transition: transform 0.2s, background 0.2s;
}
.toggle input:checked + .sw { background: #2f6fd0; border-color: #2f6fd0; }
.toggle input:checked + .sw::after { transform: translateX(15px); background: #fff; }

.btn {
  -webkit-app-region: no-drag;
  padding: 9px 16px; border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: var(--panel-2); color: var(--text);
  font-family: var(--font-body); font-size: 12.5px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--line-strong); background: color-mix(in srgb, var(--panel-2) 88%, var(--text) 8%); }
.btn.primary { background: #2f6fd0; border-color: #2f6fd0; }
.btn.primary:hover { background: #3a7de0; }
.spacer { margin-left: auto; }

/* ---------- settings ---------- */
.sheet {
  position: fixed; inset: 0;
  background: rgba(6, 9, 14, 0.6);
  backdrop-filter: blur(3px);
  display: none; z-index: 20;
}
.sheet.open { display: block; }
.sheet-inner {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 92%);
  background: var(--bg-2); border-left: 1px solid var(--line);
  padding: 22px; overflow-y: auto;
  animation: slide 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes slide { from { transform: translateX(100%); } to { transform: none; } }
.sheet h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 4px; }
.sheet .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0 0 18px; }
.field { margin-bottom: 16px; }
.field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.field input[type=text], .field input[type=number], .field input[type=datetime-local], .field select {
  width: 100%; padding: 9px 11px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--line-strong);
  color: var(--text); font-family: var(--font-body); font-size: 12.5px;
  user-select: text;
}
.field input:focus, .field select:focus { outline: 2px solid #2f6fd0; outline-offset: 1px; }
.field input[type=range] { width: 100%; accent-color: #2f6fd0; padding: 0; }
.field label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.pgroup { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.pgroup h3 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.pgroup h3 b { width: 8px; height: 8px; border-radius: 50%; }
.path-row { display: flex; gap: 6px; }
.path-row .btn { padding: 8px 11px; font-size: 11.5px; white-space: nowrap; }
.cal-row { display: flex; gap: 6px; }
.cal-row input { flex: 1; min-width: 0; }
.cal-row .btn { padding: 8px 11px; font-size: 11.5px; white-space: nowrap; }
.cal-note { color: var(--dim); font-size: 11.5px; line-height: 1.6; margin: 6px 0 0; }
.cal-note .cal-clear { padding: 2px 8px; font-size: 10.5px; margin-left: 4px; }

::-webkit-scrollbar { width: 9px; }
::-webkit-scrollbar-thumb { background: var(--track); border-radius: 9px; border: 2px solid var(--bg); }

/* ---------- โหมดมินิ ---------- */
/* โหมดมินิ = กรอบการ์ด 3 ใบล้วน ๆ ไม่มีแถบหัว ลากย้ายด้วยการจับพื้นที่การ์ด */
body.mini .titlebar { display: none; }
body.mini main { padding: 8px 10px; height: 100%; overflow: hidden; -webkit-app-region: drag; }
#mini-restore { display: none; }
body.mini #mini-restore {
  display: block; position: fixed; top: 5px; right: 5px; z-index: 30;
  width: 22px; height: 22px; border-radius: 7px;
  border: 1px solid var(--line-strong); background: color-mix(in srgb, var(--panel) 90%, transparent);
  color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
  /* ต้องแสดงตลอด — hover ใช้ไม่ได้เพราะ drag region กินเหตุการณ์เมาส์ */
  opacity: 0.55; transition: opacity 0.15s;
  -webkit-app-region: no-drag;
}
#mini-restore:hover { color: var(--text); border-color: #2f6fd0; }
body.mini .head, body.mini .bottom, body.mini .gauge, body.mini .spark, body.mini .rows, body.mini .foot .k { display: none; }
body.mini .grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
body.mini .card { padding: 8px 10px 6px; }
body.mini .card-head { margin-bottom: 4px; }
body.mini .minigauge { display: grid; margin: 2px auto 0; }
body.mini .foot { margin-top: 4px; padding-top: 6px; justify-content: center; }
body.mini .foot .t { margin-left: 0; font-size: 12px; }
body.mini .empty { padding: 6px 0; }

<script>
'use strict';

/* เรขาคณิตของหน้าปัด: ส่วนโค้ง 220 องศา */
const CX = 93, CY = 92, R = 70, A0 = 200, A1 = -20;
const ARC_LEN = R * ((A0 - A1) * Math.PI) / 180;
const pt = (deg) => [CX + R * Math.cos((deg * Math.PI) / 180), CY - R * Math.sin((deg * Math.PI) / 180)];
const ARC_D = (() => {
  const [x0, y0] = pt(A0), [x1, y1] = pt(A1);
  return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${R} ${R} 0 1 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
})();

let state = { providers: [], updatedAt: 0 };
let config = null;

/* ---------- ตัวช่วยจัดรูปแบบ ---------- */
const fmtTokens = (n) => {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k';
  return String(Math.round(n));
};
function fmtCountdown(ms) {
  if (ms === null || ms === undefined || ms < 0) return '--:--';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return h > 0 ? `${h}h ${String(m).padStart(2, '0')}m` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
const level = (pct) => (pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : '');
const dtLocal = (ms) => {
  if (!ms) return '';
  const d = new Date(ms);
  const p2 = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
};
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/* ---------- วาดการ์ด ---------- */
function ticks() {
  let s = '';
  for (let i = 0; i <= 10; i++) {
    const a = A0 - ((A0 - A1) * i) / 10;
    const [x1, y1] = pt(a);
    const rr = i % 5 === 0 ? 9 : 5;
    const x2 = CX + (R - rr) * Math.cos((a * Math.PI) / 180);
    const y2 = CY - (R - rr) * Math.sin((a * Math.PI) / 180);
    s += `<line class="tick" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${i % 5 === 0 ? 1.6 : 1}"/>`;
  }
  return s;
}

/* ---------- มาสคอตประจำผู้ให้บริการ (SVG วาดเอง ไม่พึ่ง asset ภายนอก) ---------- */
function mascotFace(mood, cy, gap = 3.5) {
  const exL = 18 - gap, exR = 18 + gap;
  const eyes = mood === 'sleep'
    ? `<path class="eyelid" d="M${exL - 1.6} ${cy} q1.6 1.8 3.2 0"/><path class="eyelid" d="M${exR - 1.6} ${cy} q1.6 1.8 3.2 0"/>`
    : `<circle class="eye" cx="${exL}" cy="${cy}" r="1.6"/><circle class="eye" cx="${exR}" cy="${cy}" r="1.6"/>`;
  const my = cy + 4;
  const mouth = mood === 'sad'
    ? `<path class="mouth" d="M${18 - 2.8} ${my + 1} Q18 ${my - 1.8} ${18 + 2.8} ${my + 1}"/>`
    : mood === 'worry'
    ? `<path class="mouth" d="M${18 - 2.6} ${my} L${18 + 2.6} ${my}"/>`
    : `<path class="mouth" d="M${18 - 2.8} ${my - 0.6} Q18 ${my + 2} ${18 + 2.8} ${my - 0.6}"/>`;
  const cheeks = `<circle class="cheek" cx="${exL - 3.4}" cy="${cy + 3}" r="1.5"/><circle class="cheek" cx="${exR + 3.4}" cy="${cy + 3}" r="1.5"/>`;
  const sweat = mood === 'sad' ? `<path class="sweat" d="M28.5 ${cy - 6} q2.4 3.4 0 4.8 q-2.4 -1.4 0 -4.8"/>` : '';
  return eyes + mouth + cheeks + sweat;
}

function mascotSvg(id, mood) {
  if (id === 'claude') {
    // ประกายดาวสีส้ม
    return `<svg viewBox="0 0 36 36" aria-hidden="true">
      <path class="body" d="M18 2 C20.5 11 25 15.5 34 18 C25 20.5 20.5 25 18 34 C15.5 25 11 20.5 2 18 C11 15.5 15.5 11 18 2 Z"/>
      ${mascotFace(mood, 16.5)}
    </svg>`;
  }
  if (id === 'chatgpt') {
    // ต้นกล้าสีเขียว
    return `<svg viewBox="0 0 36 36" aria-hidden="true">
      <path class="leaf" d="M18 8 C18 3.5 21.5 1.5 25 1.5 C25 6 21.5 8 18 8 Z"/>
      <path class="leaf l2" d="M18 8 C18 4.5 15 3 12 3 C12 6.5 15 8 18 8 Z"/>
      <circle class="body" cx="18" cy="21.5" r="12.5"/>
      ${mascotFace(mood, 20)}
    </svg>`;
  }
  // grok — ยูเอฟโอสีม่วง
  return `<svg viewBox="0 0 36 36" aria-hidden="true">
    <line class="ant" x1="18" y1="7" x2="18" y2="4"/>
    <circle class="ant-tip" cx="18" cy="3" r="1.5"/>
    <circle class="body" cx="18" cy="16" r="8.5"/>
    ${mascotFace(mood, 14.5, 3)}
    <ellipse class="saucer" cx="18" cy="25" rx="14.5" ry="5"/>
    <circle class="lamp" cx="7.5" cy="24.5" r="1.2"/>
    <circle class="lamp l2" cx="18" cy="27" r="1.2"/>
    <circle class="lamp l3" cx="28.5" cy="24.5" r="1.2"/>
  </svg>`;
}

function cardHtml(p) {
  const accent = p.accent || '#8ea2c0';
  if (p.state !== 'ok') {
    const msg = p.message || 'ไม่พบข้อมูล';
    return `
    <section class="card" style="--accent:${accent}" data-id="${p.id}">
      <div class="card-head">
        <div class="mascot m-${p.id}">${mascotSvg(p.id, 'sleep')}</div>
        <div><div class="n">${p.name}</div><div class="s">${p.subtitle || ''}</div></div>
      </div>
      <div class="empty">
        <div class="big">◌</div>
        <p>${msg}</p>
        <button class="btn" data-act="settings">เปิดหน้าตั้งค่า</button>
      </div>
    </section>`;
  }

  // การ์ดที่ปักหมุดด้วยมือ (เช่น Grok) ให้เกจหลักโชว์ % รายสัปดาห์จากเว็บแทนบล็อก 5 ชม.
  const pct = p.manual ? p.weekly.pct : p.session.pct;
  const gaugeLabel = p.manual ? 'รายสัปดาห์ · จากเว็บ' : 'บล็อก 5 ชั่วโมง';
  const off = ARC_LEN * (1 - Math.min(1, pct / 100));
  const spark = p.spark || [];
  const peak = Math.max(1, ...spark);
  const bars = spark
    .map((v, i) => `<i class="${i === spark.length - 1 ? 'now' : ''}" style="height:${Math.max(2, (v / peak) * 26)}px"></i>`)
    .join('');
  const eta = p.manual
    ? 'ตามหน้าเว็บผู้ให้บริการ'
    : p.live && pct === 0 && !p.session.tokens
    ? 'โควตาเต็ม ยังไม่ใช้รอบนี้ ✦'
    : p.estimating
    ? 'กำลังเรียนรู้พฤติกรรมการใช้'
    : p.etaMs
    ? `เต็มใน ~${fmtCountdown(p.etaMs)}`
    : 'อัตราคงที่';

  const mood = pct >= 90 ? 'sad' : pct >= 70 ? 'worry' : 'happy';
  return `
  <section class="card" style="--accent:${accent}" data-id="${p.id}">
    <div class="card-head">
      <div class="mascot m-${p.id} ${mood}">${mascotSvg(p.id, mood)}</div>
      <div><div class="n">${p.name}</div><div class="s">${p.subtitle || ''}</div></div>
      ${p.live ? '<span class="live-dot" title="% ทางการจากผู้ให้บริการโดยตรง">● สด</span>' : p.liveError ? `<span class="live-dot err" title="${p.liveError}">ค่าประมาณ</span>` : p.manual ? '<span class="live-dot man" title="ปักหมุดจากเว็บด้วยมือ — อัปเดตได้ในหน้าตั้งค่า">ปักหมุด</span>' : ''}
      <button class="pill" data-act="plan" title="${p.calibrated ? 'ลิมิตมาจากการปรับเทียบกับ % จริง' : 'เปลี่ยนแพลนได้ในหน้าตั้งค่า'}">${p.planLabel}${p.calibrated ? ' ✓' : ''}</button>
    </div>

    <div class="minigauge">
      <svg viewBox="0 0 60 60">
        <circle class="ring-bg" cx="30" cy="30" r="25"/>
        <circle class="ring-fg" cx="30" cy="30" r="25"
          stroke-dasharray="157.1" stroke-dashoffset="${(157.1 * (1 - Math.min(1, pct / 100))).toFixed(1)}"
          style="${pct >= 90 ? 'stroke:var(--danger)' : pct >= 70 ? 'stroke:var(--warn)' : ''}"/>
      </svg>
      <b>${Math.round(pct)}<i>%</i></b>
    </div>

    <div class="gauge">
      <svg viewBox="0 0 186 118" aria-label="ใช้ไป ${Math.round(pct)} เปอร์เซ็นต์">
        ${ticks()}
        <path class="arc-bg" d="${ARC_D}" fill="none" stroke-width="9" stroke-linecap="round"/>
        <path class="arc-fg" d="${ARC_D}" fill="none" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="${ARC_LEN.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
              style="${pct >= 90 ? 'stroke:var(--danger)' : pct >= 70 ? 'stroke:var(--warn)' : ''}"/>
      </svg>
      <div class="gauge-val">
        <b>${Math.round(pct)}<i>%</i></b>
        <span>${gaugeLabel}</span>
      </div>
    </div>

    <div class="rows">
      <div class="row">
        <div class="l"><span>บล็อกปัจจุบัน</span><em>${fmtTokens(p.session.tokens)} / ${fmtTokens(p.session.limit)}</em></div>
        <div class="bar ${level(pct)}"><i style="width:${Math.min(100, pct)}%"></i></div>
      </div>
      <div class="row">
        <div class="l"><span>รายสัปดาห์</span><em>${p.manual ? Math.round(p.weekly.pct) + '% จากเว็บ' : `${fmtTokens(p.weekly.tokens)} / ${fmtTokens(p.weekly.limit)}`}</em></div>
        <div class="bar ${level(p.weekly.pct)}"><i style="width:${Math.min(100, p.weekly.pct)}%"></i></div>
      </div>
      ${p.monthCostTHB != null ? `
      <div class="row cost">
        <div class="l"><span>เดือนนี้ ≈ ค่าใช้จ่าย</span><em title="ประมาณจากราคาใน config ไม่ใช่ยอดเรียกเก็บจริง">${fmtTokens(p.monthTokens)} ≈ ฿${p.monthCostTHB >= 100 ? Math.round(p.monthCostTHB).toLocaleString() : p.monthCostTHB.toFixed(2)}</em></div>
      </div>` : ''}
    </div>

    <div class="spark">${bars}</div>

    <div class="foot">
      <span class="k">รีเซ็ตอีก</span>
      <span class="t" data-reset="${p.session.resetAt || p.weekly.resetAt || ''}">--:--</span>
      <span class="k" style="margin-left:12px">${eta}</span>
    </div>
  </section>`;
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = state.providers.map(cardHtml).join('');
  const t = new Date(state.updatedAt || Date.now());
  document.getElementById('updated').textContent =
    'อัปเดต ' + t.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const active = state.providers.filter((p) => p.state === 'ok').length;
  document.getElementById('head-sub').textContent = `${active}/${state.providers.length} แหล่งข้อมูลพร้อมใช้งาน`;
  tick();
  paintTray();

/* นับถอยหลังทุกวินาที โดยไม่ต้องวาดการ์ดใหม่ */
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-reset]').forEach((n) => {
    const at = Number(n.dataset.reset);
    n.textContent = at ? fmtCountdown(at - now) : '--:--';
  });
}
setInterval(tick, 1000);

/* ---------- ไอคอนถาดระบบพร้อมตัวเลข % ---------- */
function paintTray() {
  const top = state.providers.filter((p) => p.state === 'ok').sort((a, b) => b.session.pct - a.session.pct)[0];
  const cv = document.getElementById('tray-canvas');
  const g = cv.getContext('2d');
  const pct = top ? Math.round(top.session.pct) : 0;
  const color = !top ? '#7c8aa1' : pct >= 90 ? '#ff6b6b' : pct >= 70 ? '#f5c451' : top.accent;
  g.clearRect(0, 0, 32, 32);
  g.fillStyle = color;
  g.beginPath();
  g.roundRect(1, 1, 30, 30, 8);
  g.fill();
  g.fillStyle = '#0b0e13';
  g.font = '600 ' + (pct >= 100 ? '15px' : '18px') + ' Bahnschrift, Segoe UI, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(String(Math.min(999, pct)), 16, 17);
  window.api?.sendTrayIcon(cv.toDataURL('image/png'));
}

/* ---------- หน้าประวัติ: กราฟแท่งซ้อน SVG ล้วน ---------- */
let curView = 'grid';
let hMode = 'daily';
let historyData = null;

async function openHistory() {
  historyData = await window.api.getHistory();
  drawHistory();
}

/** จัดข้อมูลรายชั่วโมงลงช่องตามโหมด (รายวัน 30 ช่อง / รายชั่วโมง 48 ช่อง) */
function seriesFor(mode) {
  const slots = historyData.slots || {};
  const now = Date.now();
  const bins = [];
  const index = new Map();
  if (mode === 'hourly') {
    const start = Math.floor(now / 3600000) * 3600000 - 47 * 3600000;
    for (let i = 0; i < 48; i++) {
      const t = start + i * 3600000;
      const b = { label: `${String(new Date(t).getHours()).padStart(2, '0')}:00`, per: {} };
      bins.push(b);
      index.set(t, b);
    }
  } else {
    const d0 = new Date(now);
    d0.setHours(0, 0, 0, 0);
    for (let i = 29; i >= 0; i--) {
      const t = d0.getTime() - i * 86400000;
      const b = { label: new Date(t).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }), per: {} };
      bins.push(b);
      index.set(t, b);
    }
  }
  for (const p of historyData.providers) {
    const slot = slots[p.id] || {};
    for (const [k, v] of Object.entries(slot)) {
      const ms = Number(k);
      let key = ms;
      if (mode !== 'hourly') {
        const d = new Date(ms);
        d.setHours(0, 0, 0, 0);
        key = d.getTime();
      }
      const b = index.get(key);
      if (b) b.per[p.id] = (b.per[p.id] || 0) + v;
    }
  }
  return bins;
}

function drawHistory() {
  if (!historyData) return;
  const provs = historyData.providers;
  const bins = seriesFor(hMode);
  const W = 720, H = 280, padL = 48, padR = 8, padT = 12, padB = 26;
  const plotH = H - padT - padB;
  const max = Math.max(1, ...bins.map((b) => provs.reduce((s, p) => s + (b.per[p.id] || 0), 0)));
  const iw = (W - padL - padR) / bins.length;
  const bw = Math.max(2, iw * 0.66);
  let out = '';
  for (const f of [0, 0.5, 1]) {
    const y = padT + plotH * (1 - f);
    out += `<line class="h-grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"/>`;
    out += `<text class="h-y" x="${padL - 6}" y="${(y + 3).toFixed(1)}">${fmtTokens(max * f)}</text>`;
  }
  const labelEvery = hMode === 'hourly' ? 6 : 5;
  bins.forEach((b, i) => {
    const x = padL + i * iw + (iw - bw) / 2;
    let y = H - padB;
    for (const p of provs) {
      const v = b.per[p.id] || 0;
      const h = plotH * (v / max);
      if (h < 0.5) continue;
      y -= h;
      out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${p.accent}" rx="1.5" opacity="0.92"><title>${b.label} — ${p.name}: ${fmtTokens(v)} token</title></rect>`;
    }
    if (i % labelEvery === 0) {
      out += `<text class="h-x" x="${(padL + i * iw + iw / 2).toFixed(1)}" y="${H - 8}">${b.label}</text>`;
    }
  });
  document.getElementById('h-chart').innerHTML = out;
  document.getElementById('h-legend').innerHTML = provs
    .map((p) => `<span><b style="background:${p.accent}"></b>${p.name}</span>`)
    .join('');
}

function switchView(v) {
  curView = v;
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x.dataset.view === v));
  document.getElementById('grid').hidden = v !== 'grid';
  document.getElementById('history').hidden = v !== 'history';
  if (v === 'history') openHistory();
}
document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => switchView(b.dataset.view)));
document.querySelectorAll('.seg-b').forEach((b) => {
  b.onclick = () => {
    hMode = b.dataset.mode;
    document.querySelectorAll('.seg-b').forEach((x) => x.classList.toggle('active', x === b));
    drawHistory();
  };
});

  ['pro', 'Pro'],
  ['max5', 'Max 5x'],
  ['max20', 'Max 20x'],

];

function calNoteHtml(p) {
  const c = p.calibration;
  if (c && (c.session || c.weekly)) {
    const parts = [];
    if (c.session) parts.push(`บล็อก ≈ ${fmtTokens(c.session)}`);
    if (c.weekly) parts.push(`สัปดาห์ ≈ ${fmtTokens(c.weekly)}`);
    return `ลิมิตที่ปรับเทียบแล้ว: ${parts.join(' · ')} <button class="btn cal-clear" data-act="cal-clear">ล้างค่า</button>`;
  }
  return 'เปิดหน้า usage ของผู้ให้บริการ แล้วกรอก % ที่เห็นจริง — แอปจะคำนวณลิมิตจริงย้อนกลับให้';
}

      </div>

        <label>โฟลเดอร์ log</label>

          <input type="text" data-f="root" value="${(p.roots[0] || '').replace(/"/g, '&quot;')}">

        </div>
      </div>

        <label>ปรับเทียบกับ % จริง</label>

      <div class="field" style="margin-bottom:8px">
        <label class="toggle"><input type="checkbox" data-f="live" ${p.liveUsage ? 'checked' : ''}><i class="sw"></i>ดึง % ทางการจาก claude.ai (เรียลไทม์)</label>
        <p class="cal-note">เมื่อเปิด แอปจะอ่าน token ของ Claude Code ในเครื่อง แล้วต่อเน็ตหา Anthropic
        ที่เดียวเท่านั้นเพื่อถาม % ทางการ — ปิดได้ตลอดเวลา</p>
      </div>` : ''}
      ${p.id === 'chatgpt' ? `
      <div class="field" style="margin-bottom:8px">
        <label class="toggle"><input type="checkbox" data-f="live" ${p.liveUsage ? 'checked' : ''}><i class="sw"></i>ถาม % ทางการจาก ChatGPT โดยตรง (ทดลอง)</label>
        <p class="cal-note">อ่าน token ของ Codex CLI แล้วถาม chatgpt.com ที่เดียวเท่านั้น —

/* ธีม: dark / light / ตามระบบ Windows (จำค่าที่เลือกไว้ใน config) */
function applyTheme() {
  const t = config?.theme || 'system';
  const light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.body.classList.toggle('light', light);
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);

async function boot() {
  config = await window.api.getConfig();
  applyTheme();
  document.getElementById('s-theme').value = config.theme || 'system';
  document.getElementById('t-mini').checked = !!config.miniMode;
  document.body.classList.toggle('mini', !!config.miniMode);
  fitMini();
  document.getElementById('t-taskbar').checked = config.showInTaskbar;
  document.getElementById('t-top').checked = config.alwaysOnTop;
  document.getElementById('t-boot').checked = config.startWithWindows;
  document.getElementById('s-refresh').value = config.refreshSeconds;
  document.getElementById('s-alert').value = config.alertThreshold;
  document.getElementById('s-weekly').value = config.weeklyMode;
  const op = Math.round((config.miniOpacity ?? 1) * 100);
  document.getElementById('s-opacity').value = op;
  document.getElementById('s-opacity-val').textContent = op + '%';
  document.getElementById('t-daily').checked = config.dailySummary?.enabled !== false;
  document.getElementById('s-daily-hour').value = config.dailySummary?.hour ?? 21;
  renderSettings();
}

function saveDailySummary() {
  setCfg({
    dailySummary: {
      enabled: document.getElementById('t-daily').checked,
      hour: Math.min(23, Math.max(0, Number(document.getElementById('s-daily-hour').value) || 21))
    }
  });
}

/* ---------- เหตุการณ์ ---------- */
document.addEventListener('click', async (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'settings') document.getElementById('sheet').classList.add('open');

  if (act === 'plan') {
    // เดิมคลิกแล้วสลับแพลนทันที — โดนเผลอคลิกบ่อยจนค่าคลาดเคลื่อน
    // เปลี่ยนเป็นเปิดหน้าตั้งค่าให้ไปเลือกอย่างตั้งใจแทน
    document.getElementById('sheet').classList.add('open');
  }

  if (act === 'pick') {
    const group = e.target.closest('.pgroup');
    const dir = await window.api.pickFolder();
    if (dir) {
      group.querySelector('[data-f=root]').value = dir;
      config = await window.api.setProvider(group.dataset.id, { roots: [dir] });
    }
  }

  if (act === 'calibrate') {
    const group = e.target.closest('.pgroup');
    const sPct = parseFloat(group.querySelector('[data-f=cal-session]').value) || 0;
    const wPct = parseFloat(group.querySelector('[data-f=cal-weekly]').value) || 0;
    const note = group.querySelector('[data-role=cal-note]');
    if (sPct <= 0 && wPct <= 0) {
      note.textContent = 'กรอก % อย่างน้อยหนึ่งช่อง (เช่น 14 ถ้าหน้า usage บอก 14%)';
      return;
    }
    const res = await window.api.calibrate(group.dataset.id, { sessionPct: sPct, weeklyPct: wPct });
    if (res.ok) {
      config = res.config;
      renderSettings();
    } else {
      note.textContent = res.message;
    }
  }

  if (act === 'cal-clear') {
    const group = e.target.closest('.pgroup');
    config = await window.api.setProvider(group.dataset.id, { calibration: null });
    renderSettings();
  }

  if (act === 'pin') {
    const group = e.target.closest('.pgroup');
    const pctV = parseFloat(group.querySelector('[data-f=man-pct]').value);
    const rsV = group.querySelector('[data-f=man-reset]').value;
    const note = group.querySelector('[data-role=man-note]');
    const resetAt = rsV ? new Date(rsV).getTime() : NaN;
    if (!(pctV >= 0 && pctV <= 100)) {
      note.textContent = 'กรอก % ระหว่าง 0–100';
      return;
    }
    if (!(resetAt > Date.now())) {
      note.textContent = 'เลือกเวลารีเซ็ตที่ยังมาไม่ถึง (ดูจากหน้า Usage ของ grok.com)';
      return;
    }
    config = await window.api.setProvider(group.dataset.id, { manual: { pct: pctV, resetAt, at: Date.now() } });
    renderSettings();
  }

  if (act === 'man-clear') {
    const group = e.target.closest('.pgroup');
    config = await window.api.setProvider(group.dataset.id, { manual: null });
    renderSettings();
  }
});

document.getElementById('b-csv').onclick = () => window.api.exportCsv();
document.getElementById('b-report').onclick = () => window.api.exportReport();

document.getElementById('w-min').onclick = () => window.api.window('minimize');
document.getElementById('w-max').onclick = () => window.api.window('maximize');
document.getElementById('w-close').onclick = () => window.api.window('close');
document.getElementById('w-mini').onclick = () => window.api.window('mini');
document.getElementById('mini-restore').onclick = () => window.api.window('mini');

document.getElementById('t-mini').onchange = (e) => window.api.setMini(e.target.checked);
document.getElementById('t-taskbar').onchange = (e) => setCfg({ showInTaskbar: e.target.checked });
document.getElementById('t-top').onchange = (e) => setCfg({ alwaysOnTop: e.target.checked });
document.getElementById('t-boot').onchange = (e) => setCfg({ startWithWindows: e.target.checked });
document.getElementById('s-refresh').onchange = (e) => setCfg({ refreshSeconds: Number(e.target.value) });
document.getElementById('s-alert').onchange = (e) => setCfg({ alertThreshold: Number(e.target.value) });
document.getElementById('s-weekly').onchange = (e) => setCfg({ weeklyMode: e.target.value });

  setCfg({ miniOpacity: Number(e.target.value) / 100 });
};
document.getElementById('t-daily').onchange = saveDailySummary;
document.getElementById('s-daily-hour').onchange = saveDailySummary;
document.getElementById('s-theme').onchange = async (e) => {
  await setCfg({ theme: e.target.value });
  applyTheme();
};

document.addEventListener('change', async (e) => {
  const group = e.target.closest('.pgroup');
  if (!group) return;
  const f = e.target.dataset.f;
  if (f === 'plan') config = await window.api.setProvider(group.dataset.id, { plan: e.target.value });
  if (f === 'live') config = await window.api.setProvider(group.dataset.id, { liveUsage: e.target.checked });
  if (f === 'enabled') config = await window.api.setProvider(group.dataset.id, { enabled: e.target.checked });
  if (f === 'root') config = await window.api.setProvider(group.dataset.id, { roots: [e.target.value] });
});

window.api.onUsage((d) => {
  state = d;
  render();
  if (curView === 'history') openHistory(); // กราฟตามข้อมูลใหม่ทุกรอบรีเฟรช
});
/* วิดเจ็ตย่อ/ขยายได้ — สเกลเนื้อหาตามขนาดหน้าต่างเทียบกับขนาดตั้งต้น 380x168 */
function fitMini() {
  if (!document.body.classList.contains('mini')) {
    document.body.style.zoom = '';
    return;
  }
  const z = Math.min(window.innerWidth / 380, window.innerHeight / 168);
  document.body.style.zoom = String(Math.max(0.55, z));
}
window.addEventListener('resize', fitMini);

window.api.onMiniMode((on) => {
  document.body.classList.toggle('mini', on);
  document.getElementById('t-mini').checked = on;
  if (on) switchView('grid'); // โหมดมินิแสดงเฉพาะการ์ด
  fitMini();
});

boot();
